name: 진화 루틴 워치독

# 자율 루틴은 실패해도 알림이 없다 — 신호가 "PR의 부재"뿐이라 사람이 매일 확인해야만 감지된다.
# 이 워크플로가 실패(exit 1)하면 GitHub이 이메일을 보내므로, 부재가 존재로 바뀐다.
# 루틴 자신이 보고하게 하는 방식으로는 "아예 뜨지 않은 경우"를 원리적으로 못 잡기에 별도 인프라에 둔다.

on:
  schedule:
    # 6시간마다 — 루틴(18:00 UTC = 03:00 KST) 뒤 첫 실행이 20:00 UTC 다.
    # 하루 1회로 두면 GitHub 이 그 한 번을 건너뛸 때 알람이 통째로 침묵한다.
    # 2026-08-29 실측: 08-27T20:00Z 실행이 아예 없었고(누락), 다른 날도 2.6h·8h 씩 밀렸다.
    # 그 사이 R46 PR 이 하루 넘게 열려 R47 이 스킵됐는데 경고가 오지 않았다.
    # 4회로 늘리면 한 번 누락돼도 다음 실행이 덮는다.
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ledger 마지막 변경 시점을 git log 로 읽는다

      - name: 진화 진척 점검
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/evolve-watchdog.sh
